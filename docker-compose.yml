services:
  postgres:
    image: postgres:16-alpine
    container_name: tsena-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tsena}
      POSTGRES_USER: ${DB_USERNAME:-tsena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tsena}
    ports:
      - "5432:5432"
    volumes:
      - tsena-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME:-tsena} -d $${DB_NAME:-tsena}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tsena-postgres-data:
